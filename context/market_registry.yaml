  - market_id: iran_charges_hormuz_fees_byptptpt_20260625175035466_july_15
    name: Iran charges Hormuz fees by...? — Iran charges Hormuz fees by July 15?
    polymarket_url: https://polymarket.com/event/iran-charges-hormuz-fees-byptptpt-20260625175035466
    category: iran_us_diplomacy
