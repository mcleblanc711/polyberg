    notes: 'This market will resolve to "Yes" if Israel officially annexes any territory
      between market creation and December 31, 2026, 11:59 PM ET. Otherwise, this market
      will resolve to "No."
  
  
      Annexation is defined as an official declaration or legal act by the Israeli government
      claiming sovereignty over territory they were not claiming at the time of this
      market''s creation.
  
  
      Qualifying examples of annexation include the 1980 Jerusalem Law, and the Golan
      Heights Law, however instances where Israeli settlers claiming administrative
      control over land without a formal annexation will not count.
  
  
      The primary resolution source for this market will be official information from
      the Israeli government; however, a consensus of credible reporting may also be
      used.'
