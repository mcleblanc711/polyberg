    name: Israel x Iran permanent peace deal by...? — Israel x Iran permanent peace
      deal by December 31, 2026?
    polymarket_url: https://polymarket.com/event/israel-x-iran-permanent-peace-deal-by
    category: iran_us_diplomacy
    thesis_bucket: Iran conflict
