    notes: 'This market will resolve to “No” if the United States takes a qualifying
      military action against Iran by the specified date, 11:59 PM Iran Standard Time.
      Otherwise this market will resolve to “Yes.”
  
  
      A qualifying military action refers to an air strike or a surface-to-surface missile
      strike, initiated by the United States, that directly impacts Iran. An air strike
      includes bombs, air-to-surface missiles, and air-launched drones. A surface-to-surface
      missile strike includes one-way attack drones and surface-to-surface missiles
      such as cruise or ballistic missiles.
  
  
      The following actions do not constitute a qualifying military action:
  
      Munitions destroyed or intercepted before impact;
  
      Surface-to-air missile strikes;
  
      Small-arms fire;
  
      Ground incursions;
  
      Cyber operations;
  
      Naval gunfire and artillery fire;
  
      Howitzers, artillery pieces, mortars, and rocket artillery (e.g. MLRS systems);
  
      Minor surface-to-surface strikes, including short range loitering munitions, FPV
      drones, and ATGM strikes;
  
      Any threat, authorization, or announcement of force that has not been executed.
  
  
      Any munition that is intercepted or destroyed before impact does not constitute
      a qualifying military action. Debris, fragments, or any wreckage from intercepted
      munitions that land on Iran do not constitute a military action regardless of
      any damage incurred.
  
  
      “Iran” refers to the terrestrial territory of Iran, including its internal waters.
      Iran’s maritime territory and airspace are not encompassed. Where territori…'
