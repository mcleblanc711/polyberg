    - announcement-driven
    resolution_date: 2026-07-15
    lifecycle: active
    notes: 'This market resolves to “Yes” if the Iranian government officially announces
      and begins collecting fees, tolls, charges, tariffs, or similar payments from
      commercial vessels which are mandatory for passage through or access to the Strait
      of Hormuz between market creation and the specified date, 11:59 PM ET. Otherwise,
      this market resolves to “No.”
  
  
      A qualifying fee must be an announced policy which applies generally to all commercial
      vessels, or a defined subcategory of commercial vessels (e.g., vessels flagged
      to the US and its allies). Isolated demanded charges will not qualify.
  
  
      A fee is mandatory if, in practice, affected commercial vessels cannot transit
      or access the Strait of Hormuz without paying it, regardless of whether Iran characterizes
      the payment as voluntary or a fee for services. Fees described as tolls, maritime
      fees, service charges, environmental fees, security fees, insurance charges, etc.
      will qualify provided they are recognized as mandatory for passage through or
      access to the Strait of Hormuz by a consensus of credible reporting (e.g., a mandatory
      insurance fee charged by the Iranian Persian Gulf Strait Authority would qualify).
  
  
      Both of the following are required to occur prior to the specified date, 11:59
      PM ET to satisfy this market’s resolution criteria:
  
      1) An official announcement from the Iranian government that such a fee is being,
      or will be, implemented.
  
      2) A consensus of credible reporting that collection of the fee has begun.
  
  
      Fees charged…'
