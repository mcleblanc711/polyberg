  - market_id: iran_permanent_peace_deal_april_22
    name: US x Iran permanent peace deal by...? — US x Iran permanent peace deal by
      April 22, 2026?
    polymarket_url: https://polymarket.com/event/us-x-iran-permanent-peace-deal-by
    category: iran_us_diplomacy
    thesis_bucket: Iran conflict
    rule_key: ''
    oracle_type: Official announcement OR consensus of credible reporting
    preferred_side: 'NO'
    risk_flags:
    - media fallback may matter
    - announcement-driven
    resolution_date: 2026-04-22
    notes: "This market will resolve to “Yes” if Iran and the United states agree to\
      \ a permanent peace deal by the specified date, 11:59 PM ET. Otherwise, this market\
      \ will resolve to “No”. \n\nA permanent peace deal refers to any agreement which\
      \ explicitly indicates that military hostilities between the United States and\
      \ Iran have ended or will permanently cease, or uses equivalent language clearly\
      \ signaling a lasting end to military hostilities between the United States and\
      \ Iran. Agreements that are explicitly temporary or which do not include a definitive\
      \ agreement to end military hostilities between the US and Iran on a lasting basis\
      \ (e.g. a temporary extension of the two-week ceasefire agreement announced on\
      \ April 7, 2026), will not qualify.\n\nA qualifying agreement will be considered\
      \ to have been established if either of the following conditions are met:\n\n\
      - The United States and Iran each sign or formally adopt a written agreement (e.g.\
      \ a treaty or multi-point agreement) which meets the above criteria.\n\n- Both\
      \ the governments of the United States and Iran provide clear public confirmation\
      \ that a qualifying agreement has been definitively established. Negotiations,\
      \ statements of progress, or other statements which do not constitute a definitive\
      \ announcement that a qualifying agreement has been reached will not count.\n\n\
      The primary resolution source for this market will be official information from\
      \ the governments of the United States and Iran; however, a consensus of credible\
      \ reporting…"
    event_slug: us-x-iran-permanent-peace-deal-by
    condition_id: '0xbbc6689d0f6d57ea42168836712237c7308b3e0118c8914d31b6126d0f3254c5'
