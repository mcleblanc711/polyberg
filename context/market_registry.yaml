  - market_id: trump_project_freedom_may31
    name: Trump restarts Project Freedom by May 31
    polymarket_url: https://polymarket.com/event/will-trump-restart-project-freedom-by-may-31
    category: announcement_risk
    thesis_bucket: "Iran conflict"
    rule_key: official_project_freedom_restart
    oracle_type: Official Trump, USG, or US military announcement; credible-reporting consensus also suffices
    preferred_side: "NO"
    risk_flags:
      - Trump social post can qualify if definitive
      - suggestions / openness / preparations explicitly excluded
      - '"substantially equivalent" escort program also qualifies — interpretive'
      - deadline gamma
      - resolves on announcement regardless of when program goes into effect
    event_slug: will-trump-restart-project-freedom-by-may-31
    condition_id: "0x9a87a0011494682e4d17a9073059cbbd32ebea4bbc7284219afb5e9a6b4ca8f6"
    yes_token_id: "57222624691525571349644607559355045246353226505678230701343597937763937089108"
    no_token_id: "66735179415343085248704122820633487548742544495028560297217288593792661325968"
    data_collection:
      fetch_gamma: true
      fetch_clob: true
      fetch_orderbook: true
    rule_risk:
      oracle_type: official_statement_required
      ambiguity: medium
      media_fallback: true
      official_statement_required: true
      dispute_risk: medium
    resolution_date: 2026-05-31
    notes: |
      YES on a definitive announcement by Trump, the USG, or the US military, by
      2026-05-31 23:59 ET, that Project Freedom — the US-led naval escort program
      for commercial ships through the Strait of Hormuz — will be restarted. A
      "substantially equivalent" US military escort/protection/retrieval program
      for commercial ships in or through the Strait also qualifies. Suggestions,
      expressions of openness, reported preparations, and other non-definitive
      statements do not qualify. The announcement resolves the market regardless
      of whether or when the program actually goes into effect. Primary source:
      official Trump/USG/US-military statements; a consensus of credible reporting
      may also be used.
