    data_collection:
      fetch_gamma: true
      fetch_clob: true
      fetch_orderbook: true
    rule_risk:
      oracle_type: official_statement_required
      ambiguity: low
      media_fallback: true
      official_statement_required: false
      dispute_risk: low
    resolution_date: 2026-05-31
    notes: |
      YES on confirmation that UAE warships transited through the Strait of Hormuz
      (narrowest portion between Iran and Oman) between market creation and
      2026-05-31 23:59 ET. Military cargo/support vessels count; commercial/civilian
      do not. Operations only in Persian Gulf, Gulf of Oman, or Arabian Sea without
      transit through the narrowest section do not qualify. Aerial ops, cyber ops,
      and proxy/third-party actions do not qualify. Resolves on official UAE
      government/military confirmation OR overwhelming consensus of credible reporting.
